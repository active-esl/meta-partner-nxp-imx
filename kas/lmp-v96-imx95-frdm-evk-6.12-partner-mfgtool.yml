# LmP v96 mfgtools integration gate for the FRDM-IMX95 partner support.

header:
  version: 14
  includes:
    - kas/lmp-v96-imx95-frdm-evk-6.12-partner.yml

distro: lmp-mfgtool
target: mfgtool-files

repos:
  # These NXP product layers append packages to IMAGE_INSTALL globally. They
  # are required by the normal product graph but must not leak Thread/Zigbee
  # applications into the deliberately small recovery initramfs.
  meta-nxp-connectivity:
    layers:
      meta-nxp-zigbee-rcp: disabled
      meta-nxp-otbr: disabled
