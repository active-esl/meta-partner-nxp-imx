# LmP v96 mfgtools integration gate for the FRDM-IMX95 partner support.

header:
  version: 14
  includes:
    - kas/lmp-v96-imx95-frdm-evk-6.12-partner.yml

distro: lmp-mfgtool
target: mfgtool-files

local_conf_header:
  imx95-v96-partner-mfgtool-layer-scope: |
    # Recovery does not consume the optional NXP Thread/Zigbee product layers.
    # Mask their policy appends rather than weakening dangling-append checks.
    BBMASK += "recipes-connectivity/(otbr|zigbee-rcp-apps|zigbee-rcp-sdk)/"
