# LmP v96 mfgtools integration gate for the FRDM-IMX95 partner support.

header:
  version: 14
  includes:
    - kas/lmp-v96-imx95-frdm-evk-6.12-partner.yml

distro: lmp-mfgtool
target: mfgtool-files

local_conf_header:
  imx95-v96-partner-mfgtool-layer-scope: |
    # The shared graph pins NXP connectivity for the product, but recovery
    # does not consume its Thread/Zigbee policy. Mask only the partner appends
    # rather than weakening dangling-append checks globally.
    BBMASK += "recipes-connectivity/(otbr|zigbee-rcp-apps|zigbee-rcp-sdk)/"
