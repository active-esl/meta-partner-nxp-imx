# Standalone mfgtools gate for the FRDM-IMX95 NXP partner support.

header:
  version: 14
  includes:
    - kas/lmp-imx95-frdm-evk-6.12-partner.yml

distro: lmp-mfgtool
target: mfgtool-files

local_conf_header:
  imx95-partner-mfgtool-layer-scope: |
    # Recovery does not consume the optional NXP Thread/Zigbee product layers.
    # Mask their policy appends rather than weakening dangling-append checks.
    BBMASK += "meta-partner-nxp-imx/recipes-connectivity/(otbr|zigbee-rcp-apps|zigbee-rcp-sdk)/"
