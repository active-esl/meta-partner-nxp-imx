# imx95 uses arm,scmi mailbox transport; OP-TEE agent pulls in lib/optee
# symbols that are not linked into SPL, causing undefined reference errors.
# CONFIG_SCMI_AGENT_OPTEE is not set

# The i.MX95 recovery script writes the FIT to eMMC user-area LBA 0x300 with
# `mmc write`.  A bootloader2 fastboot target is deliberately not used because
# FSL fastboot resolves it in the selected boot hardware partition.
# Keep NXP's recovery defconfig value here: disabling it changed the generated
# flash_all SPL container and the MX95 ROM reset midway through SDPS transfer.
CONFIG_FSL_FASTBOOT_BOOTLOADER2_OFFSET=0x300
