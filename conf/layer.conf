# We might have a conf and classes directory, append to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes*/*/*.bb ${LAYERDIR}/recipes*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-partner-nxp-imx"
BBFILE_PATTERN_meta-partner-nxp-imx := "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-partner-nxp-imx = "9"

# The IW612 OTBR overrides are meaningful only when NXP's OTBR layer is in
# BBLAYERS.  Keep them out of unrelated products (for example i.MX8MM) and
# releases where that layer is deliberately absent, avoiding dangling
# .bbappend parse failures without weakening BitBake's global safety check.
BBFILES_DYNAMIC += "nxp-otbr:${LAYERDIR}/dynamic-layers/nxp-otbr/recipes*/*/*.bbappend"
BBFILES_DYNAMIC += "imx-machine-learning:${LAYERDIR}/dynamic-layers/imx-machine-learning/recipes*/*/*.bbappend"

LAYERDEPENDS_meta-partner-nxp-imx = "meta-lmp-base"
LAYERSERIES_COMPAT_meta-partner-nxp-imx = "scarthgap"

# The FRDM kernel ships NXP's r54p1 Mali driver. Select the matching userspace
# recipe explicitly when the pinned older BSP layer also exposes r50.4.
PREFERRED_VERSION_mali-imx:imx95-frdm-evk = "r54p1.2"

# Foundries enables deterministic static user IDs.  NXP's OTBR dependency
# `radvd` creates a system user but OE's default recipe does not allocate one.
# Keep the compatibility allocation in the partner layer so product layers do
# not need to patch Foundries' central table.
USERADD_UID_TABLES:append = " files/lmp-passwd-table-nxp-connectivity"

# A list of recipe dependencies that should not be used to determine signatures
# of tasks from one recipe when they depend on tasks from another recipe.
SIGGEN_EXCLUDE_SAFE_RECIPE_DEPS += " \
    fsl-image-mfgtool-initramfs->os-release \
"
