#@TYPE: Machine
#@NAME: NXP i.MX 95 15x15 FRDM with LPDDR4x
#@SOC: i.MX95
#@DESCRIPTION: Machine configuration for NXP i.MX 95 15x15 FRDM with LPDDR4x
##@MAINTAINER: Jun Zhu <junzhu@nxp.com>

MACHINEOVERRIDES =. "mx95:"

require conf/machine/include/imx95-evk.inc

KERNEL_DEVICETREE_BASENAME = "imx95-15x15-frdm"

# This layer keeps the Scarthgap metadata for established machines but uses
# NXP's native FRDM defconfig from the machine-scoped 2025.04 recipe. Override
# the older include's hard-coded "_evk" suffix explicitly.
UBOOT_CONFIG_BASENAME = "imx95_15x15_frdm"
UBOOT_CONFIG[sd] = "imx95_15x15_frdm_defconfig,sdcard"

IMXBOOT_TARGETS_BASENAME = "flash"
# FRDM bring-up: skip flash_all (needs m7_image.bin); A55-only matches mfgtools path
IMXBOOT_TARGETS:imx95-frdm-evk = "flash_a55"
IMXBOOT_TARGETS:imx95-15x15-lpddr4x-frdm = "flash_a55"

OEI_BOARD  = "mx95lp4x-15"
DDR_TYPE   = "lpddr4x"

# NXP 2.2.0 boot firmware; scoped by this FRDM machine configuration.
PREFERRED_VERSION_imx-boot-firmware-files = "8.30"
PREFERRED_VERSION_linux-imx-headers = "6.12"

# imx-system-manager deploy: imx-sm outputs build/${SYSTEM_MANAGER_CONFIG}/m33_image.bin
SYSTEM_MANAGER_FIRMWARE_BASENAME = "m33_image"
SYSTEM_MANAGER_FIRMWARE_NAME = "${SYSTEM_MANAGER_FIRMWARE_BASENAME}-${SYSTEM_MANAGER_CONFIG}"
DDR_FIRMWARE_NAME = " \
    lpddr4x_dmem_v202409.bin \
    lpddr4x_dmem_qb_v202409.bin \
    lpddr4x_imem_v202409.bin \
    lpddr4x_imem_qb_v202409.bin \
"
OEI_DDR_CONFIG     = "MIMX95_LPDDR4X_EVK_15X15_4000MTS_FW2024.09_timing"
OEI_DDR_CONFIG_ECC = "MIMX95_LPDDR4X_EVK_15X15_4000MTS_FW2024.09_ECC_enabled_timing"

# M7 mcore-demos omitted until imx-boot flash_all / m7_image.bin is wired for FRDM
# (see IMXBOOT_TARGETS flash_a55). Re-add IMAGE_BOOT_FILES from NXP EVK when ready.
