#@TYPE: Machine
#@NAME: NXP FRDM-IMX95
#@SOC: i.MX95
#@DESCRIPTION: Machine configuration for NXP FRDM-IMX95, based on imx95-15x15-lpddr4x-frdm
#@MAINTAINER: Foundries.io NXP partner layer maintainers

MACHINEOVERRIDES =. "imx95-15x15-lpddr4x-frdm:"

require conf/machine/imx95-15x15-lpddr4x-frdm.conf

KMACHINE = "imx95-15x15-lpddr4x-frdm"

# Keep the base HDMI board DTB first/default, and deploy the complete optional
# FRDM set shipped by NXP's aligned 6.12.49-2.2.0 machine definition. Every
# entry is incorporated into the signed kernel FIT; boot.cmd selects the base
# unless the persistent frdm_dtb U-Boot variable names another signed config.
KERNEL_DEVICETREE:append:imx95-frdm-evk = " \
    freescale/imx95-15x15-frdm-8mic-reve.dtb \
    freescale/imx95-15x15-frdm-ap1302.dtb \
    freescale/imx95-15x15-frdm-aud-hat.dtb \
    freescale/imx95-15x15-frdm-boe-wxga-lvds-panel.dtb \
    freescale/imx95-15x15-frdm-dual-os08a20-isp.dtb \
    freescale/imx95-15x15-frdm-os08a20-combo-isp.dtb \
    freescale/imx95-15x15-frdm-os08a20-isp.dtb \
    freescale/imx95-15x15-frdm-waveshare-7inch-c-panel.dtb \
"

# FRDM-IMX95 Getting Started guide uses USB serial console on the debug port.
SERIAL_CONSOLES = "115200:ttyUSBConsole"

# OSTree: kernel cmdline (ttyLP0 = SoC UART behind USB debug bridge; see imx93-11x11 LmP default)
OSTREE_KERNEL_ARGS:imx95-frdm-evk ?= "console=tty1 console=ttyLP0,115200 earlycon rootfstype=ext4 rw rootwait loglevel=4 rootflags=noatime"
OSTREE_BOOTLOADER_EXTRA_CONFIG:imx95-frdm-evk = "bootdelay=1"

# Declare the physical capabilities consumed by optional product layers. The
# policy that selects display, Android or Zigbee packages remains outside this
# reference-board machine.
MACHINE_FEATURES:append:imx95-frdm-evk = " nxpiw612-sdio zigbee display-multimedia"

# meta-imx at the Foundries v96 pin still recommends the legacy userspace
# nxp-wlan-sdk recipe for IW612.  NXP removed that recommendation in its
# walnascar 6.12 BSP: the SDK duplicates the kernel driver build and its old
# source layout is not compatible with Linux 6.12.  Keep the firmware and the
# kernel module selected by meta-freescale, but do not build the obsolete SDK.
MACHINE_EXTRA_RRECOMMENDS:remove:imx95-frdm-evk = "nxp-wlan-sdk"

# U-Boot runtime DTB must match FRDM (not 15x15 EVK adv7535 panel tree — causes
# "invalid device tree", adv7535 probe failures, and mmc0 errors on FRDM).
UBOOT_DTB_NAME:imx95-frdm-evk ?= "imx95-15x15-frdm.dtb"
