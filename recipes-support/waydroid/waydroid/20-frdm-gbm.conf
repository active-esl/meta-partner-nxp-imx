[Service]
Environment=WESTON_MODULE_MAP=libgbm.so=/usr/lib/libgbm.so.1
# i.MX95 DPU/Mali damage tracking can retain a stale Waydroid frame.
# Keep Android composition in the GL primary plane and redraw the complete
# output while the generic opt-in Weston workaround is enabled.
Environment=WESTON_DRM_DISABLE_PLANES=1
Environment=WESTON_GL_FORCE_FULL_REPAINT=1
# The fixed FRDM kiosk output is always populated. The IT6263 HPD bit can
# briefly drop after a modeset and otherwise makes Weston tear down a healthy
# 1080p stream.
ExecStartPre=/bin/sh -c 'printf on > /sys/class/drm/card0-HDMI-A-1/status'
ExecStartPre=/usr/bin/install -d -m 0700 -o root -g root /run/user/0
# OSTree preserves locally changed /etc files across updates. Read the
# immutable product configuration so panel-position=none cannot be shadowed by
# a configuration inherited from an older deployment.
ExecStart=
ExecStart=/usr/bin/weston --config=/usr/etc/xdg/weston/weston.ini --log=${XDG_RUNTIME_DIR}/weston.log --modules=systemd-notify.so
