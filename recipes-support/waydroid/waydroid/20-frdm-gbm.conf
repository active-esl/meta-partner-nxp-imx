[Service]
Environment=WESTON_MODULE_MAP=libgbm.so=/usr/lib/libgbm.so.1
# i.MX95 DPU/Mali damage tracking can retain a stale Waydroid frame.
# Keep Android composition in the GL primary plane and redraw the complete
# output while the generic opt-in Weston workaround is enabled.
Environment=WESTON_DRM_DISABLE_PLANES=1
Environment=WESTON_GL_FORCE_FULL_REPAINT=1
ExecStartPre=/usr/bin/install -d -m 0700 -o root -g root /run/user/0
